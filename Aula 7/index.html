<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Formulário Super Simples</h1>
    </header>

    <main>
        <h2>Cadastro</h2>

        <form id="Cadastro" novalidate onsubmit="executar(event)">

            <Label for="nome">Nome: </Label>
            <input type="text" id="nome">
            <p id="erro-nome" class="oculto"></p>

            <Label for="idade">Idade: </Label>
            <input type="number" min="0" id="idade">
            <p id="erro-idade" class="oculto"></p>

            <Label for="email">E-Mail: </Label>
            <input type="email" id="email">
            <p id="erro-email" class="oculto"></p>

            <label>

                <input type="checkbox" name="" id="termos" required>
                Li e aceito os termos
                <p id="erro-termos" class="oculto"></p>

                <button type="submit">Enviar</button>
                <p id="concluido" class="oculto"></p>

            </label>

        </form>
    </main>

    <footer>
        <p>Projeto para conhecermos JavaScript</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
